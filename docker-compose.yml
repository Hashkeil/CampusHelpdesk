services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      retries: 10
volumes:
  campus_data:
